version: '3.8'

services:
  api-gateway:
    image: gitty-api-gateway:latest
    container_name: gitty-api-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENV=production
      - GRAPH_MODE=sqlite
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required for production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_PROVIDER=sentence-transformers
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSIONS=384
      - RAG_MAX_GRAPH_SEEDS=5
      - RAG_MAX_GRAPH_DEPTH=2
      - RAG_MAX_GRAPH_NODES=24
      - RAG_MAX_GRAPH_RELATIONSHIPS=32
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
    depends_on:
      - redis
      - rabbitmq
      - neo4j
      - qdrant

  frontend:
    image: gitty-frontend:latest
    container_name: gitty-frontend
    restart: always
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=/api/v1
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    depends_on:
      - api-gateway

  worker:
    image: gitty-worker:latest
    container_name: gitty-worker
    restart: always
    environment:
      - ENV=production
      - GRAPH_MODE=sqlite
      - NEO4J_PASSWORD=${NEO4J_PASSWORD:?NEO4J_PASSWORD is required for production}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - EMBEDDING_PROVIDER=sentence-transformers
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - EMBEDDING_DIMENSIONS=384
      - RAG_MAX_GRAPH_SEEDS=5
      - RAG_MAX_GRAPH_DEPTH=2
      - RAG_MAX_GRAPH_NODES=24
      - RAG_MAX_GRAPH_RELATIONSHIPS=32
      - LOG_LEVEL=info
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
    depends_on:
      - redis
      - rabbitmq
